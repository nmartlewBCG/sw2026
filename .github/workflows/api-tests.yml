name: API tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run API in background
        run: npm start > api.log 2>&1 & echo $! > api.pid

      - name: Wait for API health check
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3000/healthcheck > /dev/null; then
              echo "API is ready"
              exit 0
            fi
            sleep 1
          done
          echo "API did not become ready"
          cat api.log
          exit 1

      - name: Run API tests
        run: npm test